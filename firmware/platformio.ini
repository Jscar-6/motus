; TrueReach sleeve firmware (B2 + B3): 3 IMUs -> Madgwick quaternions over USB serial, vibration motors.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
; Default 460800 failed on our ELEGOO board (CP2102); 115200 is slower but reliable.
upload_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
